  <style>:host {
  --vr-navy: #10243e;
  --vr-navy-deep: #091725;
  --vr-teal: #08736a;
  --vr-text-on-dark: #eef6fb;
  --vr-muted-on-dark: #9db1c5;
  display: flex;
  min-height: 100vh;
  flex-direction: column;
  color: #17273c;
  background: #f4f7fa;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
.platform-header { position: sticky; top: 0; z-index: 1000; display: grid; grid-template-columns: auto auto minmax(0, 1fr); align-items: center; min-height: 72px; padding: 0 clamp(1rem, 4vw, 4rem); color: var(--vr-text-on-dark); border-bottom: 1px solid rgba(255,255,255,.11); background: rgba(16,36,62,.98); box-shadow: 0 8px 24px rgba(3,16,29,.14); backdrop-filter: blur(14px); }
.platform-brand { display: flex; align-items: center; gap: .75rem; min-width: max-content; color: #fff; text-decoration: none; }
.platform-mark { display: block; width: 38px; height: 38px; object-fit: contain; }
.platform-brand-copy strong,.platform-brand-copy small { display: block; }
.platform-brand-copy strong { font-size: .94rem; line-height: 1.2; }
.platform-brand-copy small { margin-top: .12rem; color: var(--vr-muted-on-dark); font-size: .69rem; }
.platform-version { margin-left: .75rem; padding: .24rem .46rem; border: 1px solid rgba(255,255,255,.13); border-radius: 999px; color: #b6c8d8; background: rgba(255,255,255,.05); font-size: .63rem; font-weight: 750; }
.platform-navigation { display: flex; justify-content: flex-end; align-items: stretch; gap: .25rem; min-width: 0; }
.platform-nav-link,.platform-nav-group>summary { position: relative; display: flex; align-items: center; min-height: 71px; padding: 0 .78rem; color: #c7d4e0; text-decoration: none; white-space: nowrap; font-size: .78rem; font-weight: 680; cursor: pointer; }
.platform-nav-link:hover,.platform-nav-link.active,.platform-nav-group>summary:hover,.platform-nav-group.active>summary,.platform-nav-group[open]>summary { color: #fff; }
.platform-nav-link.active::after,.platform-nav-group.active>summary::after { position: absolute; right: .75rem; bottom: 0; left: .75rem; height: 3px; border-radius: 3px 3px 0 0; background: #43c1b5; content: ""; }
.platform-nav-group { position: relative; }
.platform-nav-group>summary { list-style: none; }
.platform-nav-group>summary::-webkit-details-marker { display: none; }
.platform-nav-group>summary span { width: .42rem; height: .42rem; margin: -.2rem 0 0 .5rem; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); transition: transform .18s ease; }
.platform-nav-group[open]>summary span { margin-top: .18rem; transform: rotate(225deg); }
.platform-dropdown { position: absolute; top: calc(100% - 4px); left: 50%; z-index: 20; display: grid; min-width: 218px; padding: .55rem; border: 1px solid #d8e1e9; border-radius: 10px; background: #fff; box-shadow: 0 18px 38px rgba(3,16,29,.22); transform: translateX(-50%); }
.platform-docs-dropdown { grid-template-columns:1fr; min-width:240px; }
.platform-dropdown a { padding: .58rem .7rem; border-radius: 6px; color: #40556b; text-decoration: none; white-space: nowrap; font-size: .76rem; font-weight: 650; }
.platform-dropdown a:hover,.platform-dropdown a.active { color: #075f59; background: #e5f3f1; }
.platform-menu { display: none; justify-self: end; padding: .45rem .7rem; border: 1px solid rgba(255,255,255,.2); border-radius: 7px; color: #fff; background: rgba(255,255,255,.06); font: inherit; font-size: .74rem; font-weight: 750; cursor: pointer; }
.platform-content { flex: 1; min-width: 0; }
.platform-footer { display: flex; justify-content: space-between; align-items: center; gap: 2rem; padding: 1.75rem clamp(1rem, 4vw, 4rem); color: #91a4b8; background: linear-gradient(135deg,#091725,#10243e); font-size: .73rem; }
.platform-footer-brand { display:flex; align-items:center; gap:.8rem; min-width:0; }
.platform-footer-mark { flex:0 0 auto; width:30px; height:30px; object-fit:contain; }
.platform-footer strong,.platform-footer-brand span { display: block; }
.platform-footer strong { color: #fff; font-size: .86rem; }
.platform-footer-brand span { max-width:560px; margin-top:.15rem; line-height:1.5; }
.platform-footer-meta { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .65rem 1rem; }
.platform-footer-meta a { color: #c9d6e1; text-decoration: none; }
.platform-footer-meta a:hover { color: #fff; }

@media (max-width: 1180px) {
  .platform-header { grid-template-columns: auto 1fr auto; }
  .platform-version { justify-self: start; }
  .platform-menu { display: inline-flex; }
  .platform-navigation { position: absolute; top: 72px; right: 0; left: 0; display: none; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .2rem; padding: .75rem 1rem 1rem; border-bottom: 1px solid rgba(255,255,255,.1); background: #10243e; box-shadow: 0 18px 30px rgba(3,16,29,.2); }
  .platform-navigation.open { display: grid; }
  .platform-nav-link,.platform-nav-group>summary { min-height:auto; padding: .72rem .8rem; border-radius: 6px; }
  .platform-nav-link.active,.platform-nav-group.active>summary { background: rgba(67,193,181,.14); }
  .platform-nav-link.active::after,.platform-nav-group.active>summary::after { display: none; }
  .platform-dropdown { position: static; min-width:0; margin: 0 .45rem .5rem; border-color: rgba(255,255,255,.08); background:#0b1e33; box-shadow:none; transform:none; }
  .platform-docs-dropdown { grid-template-columns:1fr; width:auto; max-height:none; overflow:visible; }
  .platform-dropdown a { color:#c7d4e0; }
  .platform-dropdown a:hover,.platform-dropdown a.active { color:#fff; background:rgba(67,193,181,.14); }
}

@media (max-width: 660px) {
  .platform-header { grid-template-columns: 1fr auto; }
  .platform-version { display: none; }
  .platform-brand-copy small { max-width: 165px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .platform-navigation { grid-template-columns: 1fr; max-height: calc(100vh - 72px); overflow: auto; }
  .platform-docs-dropdown { grid-template-columns: 1fr; }
  .platform-footer { align-items: flex-start; flex-direction: column; gap: 1rem; }
  .platform-footer-brand { align-items:flex-start; }
  .platform-footer-meta { justify-content: flex-start; }
}

validation-platform-shell:not(:defined) { display:block; min-height:100vh; color:#17273c; background:#f4f7fa; }
validation-platform-shell:not(:defined)::before { display:block; height:72px; background:#10243e; box-shadow:0 8px 24px rgba(3,16,29,.14); content:""; }
validation-platform-shell:not(:defined)>* { visibility:hidden; }

function normalizedBase(value, fallback) {
  return String(value ?? fallback).replace(/\/$/, '');
}

function configuredUrls() {
  const config = globalThis.vrePlatformConfig || {};
  return config.urls || config;
}

function configuredBase(key, attributeValue, fallback) {
  const urls = configuredUrls();
  const configured = [attributeValue, urls[key], urls[`${key}Url`]]
    .find((value) => typeof value === 'string' && value.trim());
  return normalizedBase(configured, fallback);
}

function currentOriginWhen(activeApplication, applications, fallback) {
  return applications.includes(activeApplication) && /^https?:$/u.test(location.protocol)
    ? location.origin
    : fallback;
}

function developmentOrigin(port) {
  if (!/^https?:$/u.test(location.protocol)) {
    return '';
  }
  const url = new URL(location.origin);
  url.port = String(port);
  return url.origin;
}

function flattenDocsItems(items) {
  return items.flatMap((item) => (Array.isArray(item) ? [item] : flattenDocsItems(item.items)));
}

function isDocsItemActive(item) {
  if (Array.isArray(item)) {
    return location.pathname === item[1];
  }
  return item.items.some((child) => isDocsItemActive(child));
}

function firstDocsPath(section) {
  return flattenDocsItems(section.items)[0]?.[1] || '/docs/overview';
}

function isDocsSectionActive(section) {
  return section.items.some((item) => isDocsItemActive(item));
}

function isPathActive(pathname) {
  return location.pathname === pathname
    || (pathname.endsWith('/index.html') && location.pathname === pathname.replace(/index\.html$/u, ''))
    || (pathname.endsWith('/index.html') && location.pathname === pathname.replace(/\/index\.html$/u, ''));
}

class ValidationPlatformShell extends HTMLElement {
  static get observedAttributes() {
    return ['version'];
  }

  connectedCallback() {
    if (this.shadowRoot) {
      return;
    }

    const activeApplication = this.getAttribute('active-application') || '';
    const applicationName = this.getAttribute('application-name') || 'Platform';
    const version = this.getAttribute('version') || '0.0.0';
    const brandMarkUrl = this.getAttribute('brand-mark-url') || '/vre-mark.svg';
    const defaultPortalUrl = currentOriginWhen(activeApplication, ['portal', 'reports'], developmentOrigin(4200));
    const urls = {
      portal: configuredBase('portal', this.getAttribute('portal-url'), defaultPortalUrl),
      docs: configuredBase('docs', this.getAttribute('docs-url'), currentOriginWhen(activeApplication, ['documentation'], developmentOrigin(4201))),
      angular: configuredBase('angular', this.getAttribute('angular-url'), currentOriginWhen(activeApplication, ['angular-showcase'], developmentOrigin(4202))),
      react: configuredBase('react', this.getAttribute('react-url'), currentOriginWhen(activeApplication, ['react-showcase'], developmentOrigin(4204))),
      vanilla: configuredBase('vanilla', this.getAttribute('vanilla-url'), currentOriginWhen(activeApplication, ['vanilla-showcase'], developmentOrigin(4205)))
    };
    const docsActive = activeApplication === 'documentation';
    const showcasesActive = activeApplication === 'angular-showcase'
      || activeApplication === 'react-showcase'
      || activeApplication === 'vanilla-showcase';
    const reportsActive = activeApplication === 'reports';
    const docsNavigation = documentationSections.map((section) => {
      const active = docsActive && isDocsSectionActive(section);
      return `<a href="${urls.docs}${firstDocsPath(section)}"${active ? ' aria-current="page" class="active"' : ''}>${section.label}</a>`;
    }).join('');
    const showcasesNavigation = showcaseItems.map(([label, target]) => {
      const applicationId = `${target}-showcase`;
      const active = activeApplication === applicationId;
      return `<a href="${urls[target]}/"${active ? ' aria-current="page" class="active"' : ''}>${label}</a>`;
    }).join('');
    const reportsNavigation = [
      ['Tests & Coverage', '/reports/index.html'],
      ['Automation Testing', '/automation/']
    ].map(([label, pathname]) => {
      const active = reportsActive && isPathActive(pathname);
      return `<a href="${urls.portal}${pathname}"${active ? ' aria-current="page" class="active"' : ''}>${label}</a>`;
    }).join('');

    const root = this.attachShadow({ mode: 'open' });
    const injectedStyles = globalThis.validationPlatformShellStyles;
    root.innerHTML = `
      ${injectedStyles ? `<style>${injectedStyles}</style>` : '<link rel="stylesheet" href="/platform-shell.css">'}
      <header class="platform-header" part="header">
        <a class="platform-brand" href="${urls.portal || '/'}" aria-label="Validation Rules Engine home">
          <img class="platform-mark" src="${brandMarkUrl}" width="38" height="38" alt="">
          <span class="platform-brand-copy"><strong>Validation Rules Engine</strong><small>${applicationName}</small></span>
        </a>
        <span class="platform-version" data-version title="Workspace version">v${version}</span>
        <button class="platform-menu" type="button" aria-expanded="false" aria-controls="platform-navigation">Menu</button>
        <nav id="platform-navigation" class="platform-navigation" aria-label="Platform navigation">
          <a class="platform-nav-link ${activeApplication === 'portal' ? 'active' : ''}" href="${urls.portal}/"${activeApplication === 'portal' ? ' aria-current="page"' : ''}>Home</a>
          <details class="platform-nav-group ${docsActive ? 'active' : ''}">
            <summary>Docs<span aria-hidden="true"></span></summary>
            <div class="platform-dropdown platform-docs-dropdown">${docsNavigation}</div>
          </details>
          <details class="platform-nav-group ${showcasesActive ? 'active' : ''}">
            <summary>Showcases<span aria-hidden="true"></span></summary>
            <div class="platform-dropdown">${showcasesNavigation}</div>
          </details>
          <details class="platform-nav-group ${reportsActive ? 'active' : ''}">
            <summary>Reports<span aria-hidden="true"></span></summary>
            <div class="platform-dropdown">${reportsNavigation}</div>
          </details>
          <a class="platform-nav-link" href="https://github.com/kalyan-k/validation-rules-engine">GitHub</a>
        </nav>
      </header>
      <div class="platform-content"><slot></slot></div>
      <footer class="platform-footer" part="footer">
        <div class="platform-footer-brand">
          <img class="platform-footer-mark" src="${brandMarkUrl}" width="30" height="30" alt="">
          <div><strong>Validation Rules Engine</strong><span>Reusable policy validation for Angular, React, and framework-neutral TypeScript.</span></div>
        </div>
        <div class="platform-footer-meta"><span data-version>v${version}</span><span>MIT License</span><a href="${urls.docs}/docs/overview">Docs</a><a href="${urls.portal}/reports/index.html">Reports</a><a href="https://github.com/kalyan-k/validation-rules-engine">GitHub</a></div>
      </footer>`;

    const button = root.querySelector('.platform-menu');
    const nav = root.querySelector('.platform-navigation');
    button.addEventListener('click', () => {
      const expanded = button.getAttribute('aria-expanded') === 'true';
      button.setAttribute('aria-expanded', String(!expanded));
      nav.classList.toggle('open', !expanded);
    });

    const groups = [...root.querySelectorAll('.platform-nav-group')];
    groups.forEach((group) => group.addEventListener('toggle', () => {
      if (group.open) {
        groups.filter((candidate) => candidate !== group).forEach((candidate) => { candidate.open = false; });
      }
    }));
    root.querySelectorAll('.platform-dropdown a').forEach((link) => link.addEventListener('click', () => {
      groups.forEach((group) => { group.open = false; });
      button.setAttribute('aria-expanded', 'false');
      nav.classList.remove('open');
    }));
    root.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        const openGroup = groups.find((group) => group.open);
        groups.forEach((group) => { group.open = false; });
        if (nav.classList.contains('open')) {
          nav.classList.remove('open');
          button.setAttribute('aria-expanded', 'false');
          button.focus();
        } else {
          openGroup?.querySelector('summary')?.focus();
        }
      }
    });
    document.addEventListener('click', (event) => {
      const path = event.composedPath();
      if (!groups.some((group) => path.includes(group))) {
        groups.forEach((group) => { group.open = false; });
      }
    });
  }

  attributeChangedCallback(name, _previous, current) {
    if (name === 'version' && this.shadowRoot) {
      this.shadowRoot.querySelectorAll('[data-version]').forEach((element) => {
        element.textContent = `v${current || '0.0.0'}`;
      });
    }
  }
}

if (!customElements.get('validation-platform-shell')) {
  customElements.define('validation-platform-shell', ValidationPlatformShell);
