name: Publish synchronized npm packages

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: npm

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install locked dependencies
        run: npm ci

      - name: Setup Gitleaks CLI
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Setup Semgrep
        run: |
          python3 -m pip install --user semgrep
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          semgrep --version

      - name: Verify synchronized version and release tag
        run: node tools/release/verify-versions.mjs --tag

      - name: Run release quality gates (includes security gate)
        run: npm run release:verify
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-security-reports
          path: reports/security/
          if-no-files-found: warn

      - name: Publish Core with provenance
        run: npm publish ./dist/packages/core --access public --provenance

      - name: Publish Angular adapter with provenance
        run: npm publish ./dist/packages/angular --access public --provenance

      - name: Publish React adapter with provenance
        run: npm publish ./dist/packages/react --access public --provenance
