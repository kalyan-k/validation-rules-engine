name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build single-host static site
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VRE_HOSTED_EVIDENCE: '1'
          VRE_STATIC_WEB_APPS: '1'
          # Repository Actions secret/variable required here (build job has no environment:).
          VRE_CONTACT_FORM_URL: ${{ secrets.VRE_CONTACT_FORM_URL || vars.VRE_CONTACT_FORM_URL }}
          VRE_BUILD_TIME: ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at || github.run_started_at }}
        run: npm run build:site

      - name: Verify contact form config was injected
        run: |
          node -e "const fs=require('fs'); const src=fs.readFileSync('dist/site/platform-config.js','utf8'); if (!/contactFormEmbedUrl = \"https:\\/\\/docs\\.google\\.com\\/forms\\//.test(src)) { console.warn('WARNING: VRE_CONTACT_FORM_URL missing or not a docs.google.com/forms URL — Contact page will show the unconfigured state.'); } else { console.log('Contact form URL embedded in platform-config.js'); }"

      - name: Verify assembled site
        run: npm run site:verify

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_OCEAN_037D7AD10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # Pre-built artifact from npm run build:site. Reports come from hosted/evidence.
          app_location: dist/site
          api_location: ''
          output_location: ''
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_OCEAN_037D7AD10 }}
          action: close
