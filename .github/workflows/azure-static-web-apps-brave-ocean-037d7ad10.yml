name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for Karma
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Generate test and coverage reports
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          echo "Using Chrome at: $CHROME_BIN"
          npm run test:ci

      - name: Build packages and applications
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run build:all

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Chromium suite
        run: npm run test:e2e:chromium
        env:
          PLAYWRIGHT_HEADLESS: '1'
          PLAYWRIGHT_SKIP_PLATFORM_BUILD: '1'

      - name: Build single-host static site
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VRE_BUILD_TIME: ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at || github.run_started_at }}
        run: npm run build:site

      - name: Verify assembled site includes reports and automation
        run: |
          npm run site:verify
          test -f dist/site/reports/index.html
          test -f dist/site/reports/showcases/angular/tests/index.html
          test -f dist/site/reports/showcases/angular/coverage/index.html
          test -d dist/site/automation/artifacts
          test -f dist/site/api/playwright/latest.json

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_OCEAN_037D7AD10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # Pre-built artifact from npm run build:site (portal + docs + showcases + reports).
          app_location: dist/site
          api_location: ''
          output_location: ''
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_OCEAN_037D7AD10 }}
          action: close
