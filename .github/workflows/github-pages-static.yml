# Build the unified static site and deploy to GitHub Pages.
# Project sites are served under /<repo> (e.g. /validation-rules-engine), so the
# build sets VRE_SITE_BASE_PATH from actions/configure-pages.
name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build single-host static site
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VRE_HOSTED_EVIDENCE: '1'
          VRE_SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Prefer Actions secret; fall back to Actions variable for local/ops flexibility.
          # Must be available to this build job (repository secret/variable). Environment-only
          # secrets on github-pages are invisible here because this job has no environment:.
          VRE_CONTACT_FORM_URL: ${{ secrets.VRE_CONTACT_FORM_URL || vars.VRE_CONTACT_FORM_URL }}
          VRE_BUILD_TIME: ${{ github.event.head_commit.timestamp || github.run_started_at }}
        run: npm run build:site

      - name: Verify Pages artifact
        run: |
          test -f dist/site/index.html
          test -f dist/site/.nojekyll
          test -f dist/site/404.html
          test -f dist/site/platform-config.js
          node -e "const fs=require('fs'); const src=fs.readFileSync('dist/site/platform-config.js','utf8'); const configured=/contactFormEmbedUrl = \"https:\\/\\/docs\\.google\\.com\\/forms\\//.test(src); console.log(configured ? 'Contact form URL embedded in platform-config.js' : 'WARNING: VRE_CONTACT_FORM_URL missing or not a docs.google.com/forms URL');"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
