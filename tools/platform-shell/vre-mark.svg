<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">Validation Rules Engine</title>
  <desc id="description">Neutral data flows into the Validation Rules Engine, red errors flow upward, and green validated data flows out.</desc>
