    </linearGradient>
    <linearGradient id="success-flow" gradientUnits="userSpaceOnUse" x1="48" y1="0" x2="64" y2="0">
      <stop offset="0" stop-color="#38c77b"/>
      <stop offset="1" stop-color="#73efa4"/>
    </linearGradient>
  </defs>

